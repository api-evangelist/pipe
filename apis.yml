aid: pipe
name: Pipe
description: 'Pipe is an embedded financial OS that lets platforms — vertical SaaS, payment
  facilitators, and marketplaces — offer capital and cash-flow tools to the small and medium-sized
  businesses on their platform without those businesses ever leaving it. Its marquee product, Capital,
  delivers pre-approved funding offers priced from a business''s transaction data, with repayment tied
  to sales performance rather than fixed monthly payments. Partners integrate via prebuilt embedded UI
  components, a zero-code Pipe-hosted flow, or a customizable REST API, while Pipe handles the banking
  partnerships and compliance. Backed by Anthemis and Creandum. This profile was enriched by the API
  Evangelist pipeline from Pipe''s public pages; the full API reference lives behind password-gated
  partner docs at docs.pipe.com.'
